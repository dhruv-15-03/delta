name: MERGE pruning validation

on:
  push:
    branches:
      - validation/merge-pruning-20260917-78d7deb4
    paths:
      - .github/workflows/merge_pruning_validation.yaml
      - spark/src/test/scala/org/apache/spark/sql/delta/commands/merge/MergeSourcePruningValidationSuite.scala
      - spark/src/test/scala/org/apache/spark/sql/delta/commands/merge/MergeSourcePruningBenchmark.scala

permissions:
  contents: read

concurrency:
  group: merge-pruning-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.repository == 'dhruv-15-03/delta' &&
      github.event.repository.private == false &&
      github.run_number >= 5 && github.run_number <= 6 &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 1d70393ecdbdadeb633dda5106a93e5d956b0611
      SMOKE_SUITE: org.apache.spark.sql.delta.commands.merge.MergeSourcePruningValidationSuite
      SMOKE_TEST: resource serialization output smoke
      SPARK_VERSION: "4.2"
      TEST_PARALLELISM_COUNT: "1"
      NUM_SHARDS: "1"
      SPARK_LOCAL_IP: "127.0.0.1"
    steps:
      - name: Check out the validation commit
        id: checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify diagnostic-only changes and runner resources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 - <<'PY'
          import json
          import os
          import platform
          import shutil
          import subprocess
          from pathlib import Path

          output = Path("merge-pruning-results")
          output.mkdir()
          allowed = {
              ".github/workflows/merge_pruning_validation.yaml",
              "spark/src/test/scala/org/apache/spark/sql/delta/commands/merge/"
              "MergeSourcePruningValidationSuite.scala",
              "spark/src/test/scala/org/apache/spark/sql/delta/commands/merge/"
              "MergeSourcePruningBenchmark.scala",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines()
          unexpected = set(changed) - allowed
          if unexpected:
              raise SystemExit(f"Non-diagnostic changes are not allowed: {sorted(unexpected)}")

          memory = dict(
              line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines()
          )
          available_memory = int(memory["MemAvailable"].split()[0]) * 1024
          free_disk = shutil.disk_usage(".").free
          environment = {
              "base_sha": os.environ["BASE_SHA"],
              "validation_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": os.environ["GITHUB_RUN_NUMBER"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": platform.system(),
              "architecture": platform.machine(),
              "image_version": os.environ.get("ImageVersion"),
              "cpu_count": os.cpu_count(),
              "available_memory_bytes": available_memory,
              "free_disk_bytes": free_disk,
              "changed_files": changed,
              "spark_version_selector": os.environ["SPARK_VERSION"],
              "benchmark_executed": False,
              "profile": "smoke",
              "historical_baseline_run": 35367064130,
              "historical_contract_run": 35372360930,
          }
          (output / "environment.json").write_text(
              json.dumps(environment, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(environment, indent=2))
          if (os.cpu_count() or 0) < 2:
              raise SystemExit("At least two CPUs are required.")
          if available_memory < 10 * 1024**3 or free_disk < 10 * 1024**3:
              raise SystemExit("Insufficient headroom for the pinned build and dependency setup.")
          PY

      - name: Install the repository-supported JDK
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          distribution: zulu
          java-version: "17.0.20"

      - name: Compile and check style without running tests
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$GITHUB_WORKSPACE/target/validation-home"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME"
          export UC_DIR="$GITHUB_WORKSPACE/target/validation-unitycatalog"
          unset UC_REF UC_VERSION UC_REPO UC_FORCE DELTA_RELEASE_MODE SHARD_ID
          mkdir -p "$HOME"
          java -version > merge-pruning-results/java-version.txt 2>&1
          sbt_args=(
            -DsparkVersion=4.2
            'spark / Test / scalastyle'
            'spark / Test / compile'
          )
          {
            printf 'build/sbt'
            printf ' %q' "${sbt_args[@]}"
            printf '\n'
          } | tee merge-pruning-results/compile-command.txt
          build/sbt "${sbt_args[@]}" 2>&1 | tee merge-pruning-compile-full.log

      - name: Run exactly the three-minute tiny smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$GITHUB_WORKSPACE/target/validation-home"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME"
          export UC_DIR="$GITHUB_WORKSPACE/target/validation-unitycatalog"
          unset UC_REF UC_VERSION UC_REPO UC_FORCE DELTA_RELEASE_MODE SHARD_ID
          smoke_root="$GITHUB_WORKSPACE/target/validation-smoke"
          test ! -e "$smoke_root"
          mkdir -p "$smoke_root/tmp" "$smoke_root/local" "$smoke_root/jfr"
          java_options=(
            '-Dspark.master=local[2]'
            '-Dspark.test.timeout=3'
            '-Ddelta.mergePruning.profile=smoke'
            "-Ddelta.mergePruning.results=$GITHUB_WORKSPACE/merge-pruning-results"
            "-Ddelta.mergePruning.root=$smoke_root"
            "-Djava.io.tmpdir=$smoke_root/tmp"
            "-Dspark.local.dir=$smoke_root/local"
            "-XX:FlightRecorderOptions=repository=$smoke_root/jfr,maxchunksize=1m"
          )
          quoted_options=$(printf '"%s",' "${java_options[@]}")
          quoted_options="${quoted_options%,}"
          sbt_args=(
            -DsparkVersion=4.2
            'set spark / Test / parallelExecution := false'
            "set spark / Test / javaOptions ++= Seq($quoted_options)"
            "spark/testOnly $SMOKE_SUITE -- -t \"$SMOKE_TEST\""
          )
          {
            printf 'build/sbt'
            printf ' %q' "${sbt_args[@]}"
            printf '\n'
          } | tee merge-pruning-results/smoke-command.txt
          timeout --signal=TERM --kill-after=5s 180s \
            build/sbt "${sbt_args[@]}" 2>&1 | tee merge-pruning-smoke-full.log

      - name: Preserve bounded evidence and validate the exact smoke result
        id: evidence
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import tempfile
          import xml.etree.ElementTree as ET
          from collections import deque
          from pathlib import Path

          source = Path("merge-pruning-results")
          output = Path("merge-pruning-upload")
          output.mkdir(exist_ok=True)
          errors = []
          cases = []
          result = None
          synthetic = {}

          def inspect_json(path):
              if not path.is_file():
                  return None, "missing"
              if path.stat().st_size > 128 * 1024:
                  return None, "oversize"
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return None, "unreadable_or_malformed"
              if not isinstance(value, dict):
                  return None, "wrong_json_shape"
              return value, None

          def require(condition, message):
              if not condition:
                  errors.append(message)

          try:
              with tempfile.TemporaryDirectory(
                  prefix="merge-smoke-collector-", dir=os.environ["RUNNER_TEMP"]
              ) as directory:
                  fixture = Path(directory)
                  (fixture / "malformed.json").write_text("{", encoding="utf-8")
                  (fixture / "large.json").write_bytes(b"x" * (128 * 1024 + 1))
                  expected = {
                      "missing.json": "missing",
                      "malformed.json": "unreadable_or_malformed",
                      "large.json": "oversize",
                  }
                  for name, code in expected.items():
                      observed = inspect_json(fixture / name)[1]
                      synthetic[name] = {"expected": code, "observed": observed}
                      require(observed == code, f"Synthetic collector check failed: {name}")

              result, problem = inspect_json(source / "smoke.json")
              require(problem is None, f"Smoke result error: {problem}")
              if result is not None:
                  (output / "smoke.json").write_text(
                      json.dumps(result, indent=2) + "\n", encoding="utf-8"
                  )
                  require(result.get("schemaVersion") == 1, "Unexpected smoke schema.")
                  require(result.get("profile") == "smoke", "Wrong profile executed.")
                  require(result.get("status") == "passed", "Smoke did not pass.")
                  require(result.get("benchmarkExecuted") is False, "Timing matrix was invoked.")
                  require(result.get("performanceClaim") is False, "Unexpected performance claim.")
                  resources = result.get("resources", {})
                  require(resources.get("master") in ("local[2]", "local[2,1]"),
                          "Wrong Spark master.")
                  require(resources.get("defaultParallelism") == 2 and
                          resources.get("taskCpus") == 1, "Wrong task resource settings.")
                  require(0 < resources.get("maximumHeapBytes", 0) <= 1073741824,
                          "Heap guard evidence is missing or outside limits.")
                  require(resources.get("sparkVersion") == "4.2.0" and
                          resources.get("scalaVersion") == "2.13.17" and
                          resources.get("javaVersion", "").startswith("17."),
                          "Runtime pins do not match.")
                  fixture = result.get("fixture", {})
                  require(0 < fixture.get("targetRows", 0) <= 4096 and
                          0 < fixture.get("targetFiles", 0) <= 4 and
                          0 < fixture.get("targetBytes", 0) <= 1048576 and
                          0 < fixture.get("sourceRows", 0) <= 64, "Fixture caps are not proven.")
                  require(result.get("mergesStarted") == 2 and
                          result.get("mergesCompleted") == 2, "Expected exactly two MERGEs.")
                  require(result.get("readerCoverageEstablished") is True,
                          "Actual reader coverage was not established.")
                  phases = result.get("phases", [])
                  require([phase.get("phase") for phase in phases] == [
                      "actual-parquet-scan", "baseline-merge", "literal-control-merge"
                  ], "Missing or unexpected reader coverage phases.")
                  for phase in phases:
                      require(phase.get("covered") is True and
                              phase.get("dataLossEvents") == 0 and
                              phase.get("rollingRetention") is False and
                              phase.get("openRawStreams") == 0 and
                              phase.get("targetReaderBytes", 0) > 0 and
                              phase.get("targetReaderBytes") ==
                              phase.get("independentRawReaderBytes") and
                              phase.get("negativeControlBytes") == 128 and
                              phase.get("negativeControlExcludedFromTarget") is True,
                              f"Incomplete actual-reader proof: {phase.get('phase')}")
                  if len(phases) == 3:
                      require(phases[0].get("targetFilesRead") == fixture.get("targetFiles") and
                              any(name.endswith("DeltaParquetFileFormat") for name in
                                  phases[0].get("readerFormats", [])),
                              "The full fixture was not read through Delta Parquet.")
                      require(all(phase.get("dataCorrect") is True and
                                  phase.get("metricsCorrect") is True for phase in phases[1:]),
                              "The two MERGEs did not prove data/metric correctness.")
                  require(all(result.get("outputChecks", {}).get(key) is True for key in (
                      "roundTrip", "atomicReplacement", "syntheticFailureRecord"
                  )), "Output/serialization checks are incomplete.")
                  require(0 < result.get("elapsedMs", 0) <= 180000,
                          "Smoke elapsed-time evidence is outside its budget.")
                  require(0 < result.get("peakTemporaryBytes", 0) <= 16777216 and
                          result.get("openRawStreamsAfterCleanup") == 0 and
                          result.get("scratchDataRemoved") is True, "Cleanup/cap proof failed.")

              suite = os.environ["SMOKE_SUITE"]
              reports = list(Path("spark-unified/target").rglob(
                  f"*{suite.rsplit('.', 1)[-1]}*.xml"
              ))
              require(len(reports) == 1, "Exactly one intended test report is required.")
              for path in reports:
                  if path.stat().st_size > 1024 * 1024:
                      errors.append("The test report exceeded its size limit.")
                      continue
                  root = ET.parse(path).getroot()
                  require(root.tag == "testsuite" and root.get("name") == suite,
                          "Wrong test-suite identity.")
                  for case in root.findall("testcase"):
                      detail = next((case.find(tag) for tag in ("failure", "error", "skipped")
                                     if case.find(tag) is not None), None)
                      cases.append({
                          "name": case.get("name"),
                          "seconds": case.get("time"),
                          "outcome": "passed" if detail is None else detail.tag,
                          "message": None if detail is None else
                          (detail.get("message") or detail.text or "")[:2048],
                      })
              require(len(cases) == 1 and cases[0]["name"] == os.environ["SMOKE_TEST"] and
                      cases[0]["outcome"] == "passed", "The one selected smoke test did not pass.")
              require(os.environ["COMPILE_OUTCOME"] == "success" and
                      os.environ["SMOKE_OUTCOME"] == "success",
                      "Compile or smoke command failed; no success fallback is allowed.")
          except Exception as error:
              errors.append(f"Evidence collection failed: {type(error).__name__}: {str(error)[:1024]}")
          finally:
              for name in ("environment.json", "java-version.txt", "compile-command.txt",
                           "smoke-command.txt", "serialization.json", "synthetic-failure.json"):
                  path = source / name
                  try:
                      if path.is_file() and path.stat().st_size <= 32 * 1024:
                          shutil.copyfile(path, output / name)
                      elif path.exists():
                          errors.append(f"Excluded oversized evidence: {name}")
                  except OSError as error:
                      errors.append(f"Cannot preserve {name}: {str(error)[:512]}")
              for phase in ("compile", "smoke"):
                  log = Path(f"merge-pruning-{phase}-full.log")
                  if log.exists():
                      try:
                          with log.open(errors="replace") as stream:
                              tail = deque((line[-1024:] for line in stream), maxlen=120)
                          (output / f"{phase}-log-tail.txt").write_text(
                              "".join(tail), encoding="utf-8"
                          )
                      except OSError as error:
                          errors.append(f"Cannot preserve {phase} log: {str(error)[:512]}")
              # Never let a malformed/large raw result prevent a small failure packet.
              for path in list(output.iterdir()):
                  if path.is_file() and path.stat().st_size > 256 * 1024:
                      errors.append(f"Excluded oversized upload: {path.name}")
                      path.unlink()
              packet = {
                  "status": "failed" if errors else "passed",
                  "profile": "smoke",
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "compile_outcome": os.environ["COMPILE_OUTCOME"],
                  "smoke_outcome": os.environ["SMOKE_OUTCOME"],
                  "selected_tests": len(cases),
                  "cases": cases[:2],
                  "errors": errors[:30],
                  "collector_checks": {"synthetic": True, "results": synthetic},
                  "benchmark_executed": False,
                  "historical_results_not_rerun": {"baseline": "7/7", "contracts": "12/13"},
              }
              (output / "smoke-report.json").write_text(
                  json.dumps(packet, indent=2) + "\n", encoding="utf-8"
              )
              print(json.dumps(packet, indent=2))
              if sum(path.stat().st_size for path in output.iterdir()) > 2 * 1024**2:
                  raise SystemExit("Bounded failure packet exceeded the 2 MiB upload budget.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write("artifact_ready=true\n")
          if errors:
              raise SystemExit("The smoke/evidence gate failed; inspect the bounded artifact.")
          PY

      - name: Upload small validation evidence
        if: always() && steps.evidence.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-pruning-smoke-${{ github.run_id }}
          path: merge-pruning-upload/
          retention-days: 1
          if-no-files-found: warn
